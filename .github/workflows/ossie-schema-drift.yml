name: Ossie schema drift

# Weekly (and on demand) check that the vendored Apache Ossie core-spec schema
# in packages/osi-orionbelt still matches upstream apache/ossie. On drift it
# opens (or comments on) a tracking issue so a schema change never lands
# unnoticed. The check itself is stdlib-only; see
# packages/osi-orionbelt/scripts/check_ossie_schema_drift.py.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check upstream Ossie schema drift
        id: drift
        run: |
          set +e
          python3 packages/osi-orionbelt/scripts/check_ossie_schema_drift.py > drift-report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat drift-report.md

      - name: Open or update tracking issue on drift
        if: steps.drift.outputs.code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('drift-report.md', 'utf8');
            const title = 'Ossie schema drift: vendored osi-schema.json is behind apache/ossie';
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "Ossie schema drift"`;
            const found = (await github.rest.search.issuesAndPullRequests({ q })).data.items[0];
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body: `Still drifting as of ${new Date().toISOString()}:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
