[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ob-flight-extension"
version = "2.6.1"
description = "Arrow Flight SQL server extension for orionbelt-api (DBeaver, Tableau, Power BI)"
license = "BUSL-1.1"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Ralf Becher", email = "info@orionbelt.ai" }]
keywords = ["arrow", "flight-sql", "dbeaver", "tableau", "orionbelt", "semantic-layer"]
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "ob-driver-core>=0.1",
]

[project.optional-dependencies]
duckdb      = ["ob-duckdb>=0.1"]
snowflake   = ["ob-snowflake>=0.1"]
postgres    = ["ob-postgres>=0.1"]
clickhouse  = ["ob-clickhouse>=0.1"]
dremio      = ["ob-dremio>=0.1"]
databricks  = ["ob-databricks>=0.1"]
all = [
    "ob-duckdb>=0.1",
    "ob-snowflake>=0.1",
    "ob-postgres>=0.1",
    "ob-clickhouse>=0.1",
    "ob-dremio>=0.1",
    "ob-databricks>=0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ob_flight"]

[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
ignore = [
    # PEP 249 is an untyped boundary by specification: ``execute()`` takes
    # whatever the caller passes, and every cursor wraps a native object no
    # vendor annotates. ``Any`` there is the honest signature, not a missing one.
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
# A test reads better with its patches nested, and its return type says nothing
# a reader needs.
"tests/**" = ["ANN001", "ANN201", "SIM117"]
# A Flight server reads bytes a client chose. Wire parsing, catalog lookups and
# routing answer "not this shape" for anything malformed rather than failing the
# connection, which is what these broad handlers are for.
"src/ob_flight/flight_sql.py" = ["BLE001", "S110"]
"src/ob_flight/server_routing.py" = ["BLE001", "S110"]
"src/ob_flight/server_catalog.py" = ["BLE001", "S110"]
"src/ob_flight/server.py" = ["BLE001", "S110"]
"src/ob_flight/server_execution.py" = ["BLE001", "S110"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ob_flight"]

[[tool.mypy.overrides]]
# pyarrow ships without a py.typed marker (same as the parent
# orionbelt-semantic-layer override). Without this, every pyarrow /
# pyarrow.flight / pyarrow.parquet import emits a noisy
# ``Skipping analyzing ...`` warning that masks real errors.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires running orionbelt-api + DBeaver"]
addopts = "-m 'not integration'"
