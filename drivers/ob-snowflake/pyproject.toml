[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ob-snowflake"
version = "2.6.1"
description = "OrionBelt Semantic Layer driver for Snowflake (DB-API 2.0)"
license = "BUSL-1.1"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Ralf Becher", email = "info@orionbelt.ai" }]
keywords = ["snowflake", "semantic-layer", "obml", "db-api", "orionbelt"]
requires-python = ">=3.12"
dependencies = [
    "ob-driver-core>=0.1",
    "snowflake-connector-python>=3.0",
    # ``fetch_arrow_table`` builds its schema from the cursor description, so
    # Arrow is a runtime dependency of this driver and not only of the
    # connector's optional Arrow path - see ``ob_snowflake.arrow_types``.
    "pyarrow>=16.0",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
    "respx>=0.21",
]

[project.entry-points."sqlalchemy.dialects"]
"ob.snowflake" = "ob_snowflake.dialect:OBSnowflakeDialect"

[tool.hatch.build.targets.wheel]
packages = ["src/ob_snowflake"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ob_snowflake"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires live DB + OB API"]
addopts = "-m 'not integration'"
