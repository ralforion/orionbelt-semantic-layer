[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ob-duckdb"
version = "2.6.1"
description = "OrionBelt Semantic Layer driver for DuckDB (DB-API 2.0)"
license = "BUSL-1.1"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Ralf Becher", email = "info@orionbelt.ai" }]
keywords = ["duckdb", "semantic-layer", "obml", "db-api", "orionbelt"]
requires-python = ">=3.12"
dependencies = [
    "ob-driver-core>=0.1",
    "duckdb>=1.0",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.entry-points."sqlalchemy.dialects"]
"ob.duckdb" = "ob_duckdb.dialect:OBDuckDBDialect"

[tool.hatch.build.targets.wheel]
packages = ["src/ob_duckdb"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    # PEP 249 is an untyped boundary by specification: ``execute()`` takes
    # whatever the caller passes, and every cursor wraps a native object no
    # vendor annotates. ``Any`` there is the honest signature, not a missing one.
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
# A test reads better with its patches nested, and its return type says nothing
# a reader needs.
"tests/**" = ["ANN001", "ANN201", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ob_duckdb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Note: no integration marker needed — DuckDB :memory: runs anywhere
