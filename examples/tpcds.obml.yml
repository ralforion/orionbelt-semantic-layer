# ── Measures ───────────────────────────────────────────────────────

measures:

  # Store-channel measures
  Store Sales Amount:
    expression: "{[Store Sales].[Ext Sales Price]}"
    resultType: float
    aggregation: sum
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  Store Net Profit:
    columns:
      - dataObject: Store Sales
        column: Net Profit
    resultType: float
    aggregation: sum
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  Store Ext List Price:
    columns:
      - dataObject: Store Sales
        column: Ext List Price
    resultType: float
    aggregation: sum
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  Store Ext Tax:
    columns:
      - dataObject: Store Sales
        column: Ext Tax
    resultType: float
    aggregation: sum
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  Store Sale Count:
    columns:
      - dataObject: Store Sales
        column: Ticket Number
    resultType: int
    aggregation: count
    distinct: true
    dataType: bigint
    format: "#,##0"

  Store Quantity:
    columns:
      - dataObject: Store Sales
        column: Quantity
    resultType: float
    aggregation: sum
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  Avg Sales Price:
    columns:
      - dataObject: Store Sales
        column: Sales Price
    resultType: float
    aggregation: avg
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  Avg List Price:
    columns:
      - dataObject: Store Sales
        column: List Price
    resultType: float
    aggregation: avg
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  # Returns
  Return Amount:
    columns:
      - dataObject: Store Returns
        column: Return Amount
    resultType: float
    aggregation: sum
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  Return Count:
    columns:
      - dataObject: Store Returns
        column: Ticket Number
    resultType: int
    aggregation: count
    dataType: bigint
    format: "#,##0"

  # Web channel
  Web Sales Amount:
    columns:
      - dataObject: Web Sales
        column: Ext Sales Price
    resultType: float
    aggregation: sum
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  Web Net Profit:
    columns:
      - dataObject: Web Sales
        column: Net Profit
    resultType: float
    aggregation: sum
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  Avg Web Quantity:
    columns: [{dataObject: Web Sales, column: Quantity}]
    resultType: float
    aggregation: avg
    dataType: "decimal(18, 6)"

  Avg Refunded Cash:
    columns: [{dataObject: Web Returns, column: Refunded Cash}]
    resultType: float
    aggregation: avg
    dataType: "decimal(18, 6)"

  Avg Return Fee:
    columns: [{dataObject: Web Returns, column: Return Fee}]
    resultType: float
    aggregation: avg
    dataType: "decimal(18, 6)"

  Web Returns Amount:
    columns:
      - dataObject: Web Returns
        column: Return Amount
    resultType: float
    aggregation: sum
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  # Catalog channel
  Catalog Sales Amount:
    columns:
      - dataObject: Catalog Sales
        column: Ext Sales Price
    resultType: float
    aggregation: sum
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  Catalog Net Profit:
    columns:
      - dataObject: Catalog Sales
        column: Net Profit
    resultType: float
    aggregation: sum
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  Catalog Quantity:
    columns:
      - dataObject: Catalog Sales
        column: Quantity
    resultType: float
    aggregation: sum
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  Catalog Returns Amount:
    columns:
      - dataObject: Catalog Returns
        column: Return Amount
    resultType: float
    aggregation: sum
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  # Inventory
  Inventory On Hand:
    columns:
      - dataObject: Inventory
        column: Quantity On Hand
    resultType: float
    aggregation: sum
    dataType: bigint
    format: "#,##0"

  Avg Inventory:
    columns:
      - dataObject: Inventory
        column: Quantity On Hand
    resultType: float
    aggregation: avg
    dataType: "decimal(18, 2)"
    format: "#,##0.00"

  Class Revenue:
    columns:
      - dataObject: Store Sales
        column: Ext Sales Price
    resultType: float
    aggregation: sum
    grain:
      mode: FIXED
      keepOnly: [Class]
    dataType: "decimal(18, 2)"


  Sales Price Sum:
    columns:
      - dataObject: Store Sales
        column: Sales Price
    resultType: float
    aggregation: sum
    dataType: "decimal(18, 2)"

  Manufacturer Sales:
    columns: [{dataObject: Store Sales, column: Sales Price}]
    resultType: float
    aggregation: sum
    grain:
      mode: FIXED
      keepOnly: [Manufacturer ID]
    dataType: "decimal(18, 2)"

  Manufacturer Quarter Groups:
    columns: [{dataObject: Date, column: Quarter of Year}]
    resultType: int
    aggregation: count
    distinct: true
    grain:
      mode: FIXED
      keepOnly: [Manufacturer ID]
    dataType: bigint

  Manager Sales:
    columns:
      - dataObject: Store Sales
        column: Sales Price
    resultType: float
    aggregation: sum
    grain:
      mode: FIXED
      keepOnly: [Manager ID]
    dataType: "decimal(18, 2)"

  Manager Month Groups:
    columns:
      - dataObject: Date
        column: Month of Year
    resultType: int
    aggregation: count
    distinct: true
    grain:
      mode: FIXED
      keepOnly: [Manager ID]
    dataType: bigint

