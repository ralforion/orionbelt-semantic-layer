# yaml-language-server: $schema=../schema/obml-schema.json
#
# TPC-DS Semantic Model — all three sales channels, their returns, and inventory.
#
# ClickHouse maps the OBML `schema` to its own database namespace, so set
# `schema: tpcds` on every data object. The `database` field is required by
# OBML but unused for ClickHouse table refs (it produces "schema"."code").
# The model is dialect-portable and is verified on DuckDB as well.
#
# Seven fact tables:
#   - Store Sales / Catalog Sales / Web Sales
#   - Store Returns / Catalog Returns / Web Returns
#   - Inventory
# joined to the conformed dimensions those channels share. Sized to answer the
# questions behind 30 cross-engine-verified queries of the TPC-DS suite.
#
version: 1.0

settings:
  defaultDialect: clickhouse
  defaultNumericDataType: "decimal(18, 2)"

dataObjects:

  # ── Conformed dimensions ───────────────────────────────────────────

  Date:
    code: date_dim
    database: tpcds
    schema: tpcds
    columns:
      Date Key:
        code: d_date_sk
        abstractType: int
        primaryKey: true
      Date:
        code: d_date
        abstractType: date
      Year:
        code: d_year
        abstractType: int
      Month of Year:
        code: d_moy
        abstractType: int
      Day of Month:
        code: d_dom
        abstractType: int
      Day of Week:
        code: d_dow
        abstractType: int
      Quarter of Year:
        code: d_qoy
        abstractType: int
      Day Name:
        code: d_day_name
        abstractType: string
      Month Sequence:
        code: d_month_seq
        abstractType: int
      Week Sequence:
        code: d_week_seq
        abstractType: int
      Year-Month:
        # Computed column: combines year and month-of-year into one int
        # like 200011 — exercises the recent ORDER-BY-on-computed-column fix.
        expression: "({Year} * 100 + {Month of Year})"
        abstractType: int

  Customer:
    code: customer
    database: tpcds
    schema: tpcds
    columns:
      Customer Key:
        code: c_customer_sk
        abstractType: int
        primaryKey: true
      Customer ID:
        code: c_customer_id
        abstractType: string
      First Name:
        code: c_first_name
        abstractType: string
      Last Name:
        code: c_last_name
        abstractType: string
      Email:
        code: c_email_address
        abstractType: string
      Preferred Flag:
        code: c_preferred_cust_flag
        abstractType: string
      Salutation:
        code: c_salutation
        abstractType: string
      Birth Country:
        code: c_birth_country
        abstractType: string
      Customer Address Key:
        code: c_current_addr_sk
        abstractType: int
      Customer Demographics Key:
        code: c_current_cdemo_sk
        abstractType: int
    joins:
      - joinType: many-to-one
        joinTo: Customer Address
        columnsFrom: [Customer Address Key]
        columnsTo: [Address Key]
      - joinType: many-to-one
        joinTo: Customer Demographics
        columnsFrom: [Customer Demographics Key]
        columnsTo: [Demographics Key]

  Customer Address:
    code: customer_address
    database: tpcds
    schema: tpcds
    columns:
      Address Key:
        code: ca_address_sk
        abstractType: int
        primaryKey: true
      City:
        code: ca_city
        abstractType: string
      County:
        code: ca_county
        abstractType: string
      State:
        code: ca_state
        abstractType: string
      Zip:
        code: ca_zip
        abstractType: string
      Zip 5:
        expression: "SUBSTRING({Zip}, 1, 5)"
        abstractType: string
      Country:
        code: ca_country
        abstractType: string
      GMT Offset:
        code: ca_gmt_offset
        abstractType: float

  # The same physical table in its second role: the address a sale was made
  # to (ss_addr_sk), as opposed to the customer's current address reached
  # through Customer. A role is its own data object because a query needs
  # both at once, each with its own alias (Q68).
  Sale Address:
    code: customer_address
    database: tpcds
    schema: tpcds
    columns:
      Address Key:
        code: ca_address_sk
        abstractType: int
        primaryKey: true
      City:
        code: ca_city
        abstractType: string
      # Cross-object: the customer's *current* city lives on the other role.
      City Differs From Customer:
        expression: "{City} <> {[Customer Address].[City]}"
        abstractType: boolean

  # Two roles of customer_demographics on one web return: whose goods came
  # back (refunded) and who sent them back (returning). Q85 compares the two,
  # which needs both in one query, each with its own alias.
  Refunded Demographics:
    code: customer_demographics
    database: tpcds
    schema: tpcds
    columns:
      Demographics Key:
        code: cd_demo_sk
        abstractType: int
        primaryKey: true
      Marital Status:
        code: cd_marital_status
        abstractType: string
      Education Status:
        code: cd_education_status
        abstractType: string
      # Cross-object: the other role's value for the same return.
      Same Marital Status:
        expression: "{Marital Status} = {[Returning Demographics].[Marital Status]}"
        abstractType: boolean
      Same Education Status:
        expression: "{Education Status} = {[Returning Demographics].[Education Status]}"
        abstractType: boolean

  Returning Demographics:
    code: customer_demographics
    database: tpcds
    schema: tpcds
    columns:
      Demographics Key:
        code: cd_demo_sk
        abstractType: int
        primaryKey: true
      Marital Status:
        code: cd_marital_status
        abstractType: string
      Education Status:
        code: cd_education_status
        abstractType: string

  # The address a refund went to (wr_refunded_addr_sk), a third role of
  # customer_address alongside Customer Address and Sale Address.
  Refunded Address:
    code: customer_address
    database: tpcds
    schema: tpcds
    columns:
      Address Key:
        code: ca_address_sk
        abstractType: int
        primaryKey: true
      Country:
        code: ca_country
        abstractType: string
      State:
        code: ca_state
        abstractType: string

  # date_dim in its web-sold-date role. Web Sales and Web Returns both join
  # the shared Date object, which leaves a plain Year filter to pick a role by
  # path length; Q85 means the sold date specifically.
  Web Sold Date:
    code: date_dim
    database: tpcds
    schema: tpcds
    columns:
      Date Key:
        code: d_date_sk
        abstractType: int
        primaryKey: true
      Year:
        code: d_year
        abstractType: int

  # date_dim in its store-returned-date role, so a filter on the return's
  # year/month cannot bind to the sold date — Store Sales and Store Returns
  # both join the shared Date object.
  Store Returned Date:
    code: date_dim
    database: tpcds
    schema: tpcds
    columns:
      Date Key:
        code: d_date_sk
        abstractType: int
        primaryKey: true
      Year:
        code: d_year
        abstractType: int
      Month of Year:
        code: d_moy
        abstractType: int

  Customer Demographics:
    code: customer_demographics
    database: tpcds
    schema: tpcds
    columns:
      Demographics Key:
        code: cd_demo_sk
        abstractType: int
        primaryKey: true
      Gender:
        code: cd_gender
        abstractType: string
      Marital Status:
        code: cd_marital_status
        abstractType: string
      Education Status:
        code: cd_education_status
        abstractType: string
      Purchase Estimate:
        code: cd_purchase_estimate
        abstractType: int
        numClass: non-additive
      Credit Rating:
        code: cd_credit_rating
        abstractType: string
      Dependent Count:
        code: cd_dep_count
        abstractType: int
        numClass: non-additive
      Employed Dependent Count:
        code: cd_dep_employed_count
        abstractType: int
        numClass: non-additive
      College Dependent Count:
        code: cd_dep_college_count
        abstractType: int
        numClass: non-additive

  Item:
    code: item
    database: tpcds
    schema: tpcds
    columns:
      Item Key:
        code: i_item_sk
        abstractType: int
        primaryKey: true
      Item ID:
        code: i_item_id
        abstractType: string
      Item Description:
        code: i_item_desc
        abstractType: string
      Brand ID:
        code: i_brand_id
        abstractType: int
      Brand:
        code: i_brand
        abstractType: string
      Category:
        code: i_category
        abstractType: string
      Class:
        code: i_class
        abstractType: string
      Manufacturer ID:
        code: i_manufact_id
        abstractType: int
      Manufacturer:
        code: i_manufact
        abstractType: string
      Manager ID:
        code: i_manager_id
        abstractType: int
      Current Price:
        code: i_current_price
        abstractType: float
        numClass: non-additive
      Product Name:
        code: i_product_name
        abstractType: string
      Category ID:
        code: i_category_id
        abstractType: int

  Store:
    code: store
    database: tpcds
    schema: tpcds
    columns:
      Store Key:
        code: s_store_sk
        abstractType: int
        primaryKey: true
      Store ID:
        code: s_store_id
        abstractType: string
      Store Name:
        code: s_store_name
        abstractType: string
      Store City:
        code: s_city
        abstractType: string
      Store County:
        code: s_county
        abstractType: string
      Store State:
        code: s_state
        abstractType: string
      Store Zip:
        code: s_zip
        abstractType: string
      Number Employees:
        code: s_number_employees
        abstractType: int
      GMT Offset:
        code: s_gmt_offset
        abstractType: float
      Store City 30:
        expression: "SUBSTRING({Store City}, 1, 30)"
        abstractType: string
      Company ID:
        code: s_company_id
        abstractType: int
      Street Number:
        code: s_street_number
        abstractType: string
      Street Name:
        code: s_street_name
        abstractType: string
      Street Type:
        code: s_street_type
        abstractType: string
      Suite Number:
        code: s_suite_number
        abstractType: string
      # Cross-object: the customer's address is a column of another data
      # object, reached through the joins the query already walks (Q19).
      Zip Matches Customer:
        expression: "SUBSTRING({Store Zip}, 1, 5) = {[Customer Address].[Zip 5]}"
        abstractType: boolean

  Promotion:
    code: promotion
    database: tpcds
    schema: tpcds
    columns:
      Promo Key:
        code: p_promo_sk
        abstractType: int
        primaryKey: true
      Promo Name:
        code: p_promo_name
        abstractType: string
      Channel Email:
        code: p_channel_email
        abstractType: string
      Channel Event:
        code: p_channel_event
        abstractType: string
      Channel DMail:
        code: p_channel_dmail
        abstractType: string
      Channel TV:
        code: p_channel_tv
        abstractType: string

  Warehouse:
    code: warehouse
    database: tpcds
    schema: tpcds
    columns:
      Warehouse Key:
        code: w_warehouse_sk
        abstractType: int
        primaryKey: true
      Warehouse ID:
        code: w_warehouse_id
        abstractType: string
      Warehouse Name:
        code: w_warehouse_name
        abstractType: string
      Warehouse Sq Ft:
        code: w_warehouse_sq_ft
        abstractType: int
        numClass: non-additive
      Warehouse City:
        code: w_city
        abstractType: string
      Warehouse State:
        code: w_state
        abstractType: string
      Warehouse Country:
        code: w_country
        abstractType: string
      Warehouse Name 20:
        expression: "SUBSTRING({Warehouse Name}, 1, 20)"
        abstractType: string

  Ship Mode:
    code: ship_mode
    database: tpcds
    schema: tpcds
    columns:
      Ship Mode Key:
        code: sm_ship_mode_sk
        abstractType: int
        primaryKey: true
      Ship Mode ID:
        code: sm_ship_mode_id
        abstractType: string
      Ship Type:
        code: sm_type
        abstractType: string
      Ship Carrier:
        code: sm_carrier
        abstractType: string

  Reason:
    code: reason
    database: tpcds
    schema: tpcds
    columns:
      Reason Key:
        code: r_reason_sk
        abstractType: int
        primaryKey: true
      Reason ID:
        code: r_reason_id
        abstractType: string
      Reason Description:
        code: r_reason_desc
        abstractType: string
      Reason Description 20:
        expression: "SUBSTRING({Reason Description}, 1, 20)"
        abstractType: string

  Household Demographics:
    code: household_demographics
    database: tpcds
    schema: tpcds
    columns:
      Demo Key:
        code: hd_demo_sk
        abstractType: int
        primaryKey: true
      Buy Potential:
        code: hd_buy_potential
        abstractType: string
      Dependent Count:
        code: hd_dep_count
        abstractType: int
      Vehicle Count:
        code: hd_vehicle_count
        abstractType: int
      Dependents Per Vehicle:
        expression: "(CASE WHEN {Vehicle Count} > 0 THEN ({Dependent Count} * 1.000) / {Vehicle Count} ELSE NULL END)"
        abstractType: float

  Time:
    code: time_dim
    database: tpcds
    schema: tpcds
    columns:
      Time Key:
        code: t_time_sk
        abstractType: int
        primaryKey: true
      Hour:
        code: t_hour
        abstractType: int
      Minute:
        code: t_minute
        abstractType: int

  Web Page:
    code: web_page
    database: tpcds
    schema: tpcds
    columns:
      Web Page Key:
        code: wp_web_page_sk
        abstractType: int
        primaryKey: true
      Char Count:
        code: wp_char_count
        abstractType: int
        numClass: non-additive

  Web Site:
    code: web_site
    database: tpcds
    schema: tpcds
    columns:
      Web Site Key:
        code: web_site_sk
        abstractType: int
        primaryKey: true
      Web Name:
        code: web_name
        abstractType: string

  Call Center:
    code: call_center
    database: tpcds
    schema: tpcds
    columns:
      Call Center Key:
        code: cc_call_center_sk
        abstractType: int
        primaryKey: true
      Call Center ID:
        code: cc_call_center_id
        abstractType: string
      Call Center Name:
        code: cc_name
        abstractType: string
      Call Center Manager:
        code: cc_manager
        abstractType: string

  # ── Fact tables ────────────────────────────────────────────────────

  Store Sales:
    code: store_sales
    database: tpcds
    schema: tpcds
    columns:
      Sold Date Key:
        code: ss_sold_date_sk
        abstractType: int
      Item Key:
        code: ss_item_sk
        abstractType: int
      Customer Key:
        code: ss_customer_sk
        abstractType: int
      CDemo Key:
        code: ss_cdemo_sk
        abstractType: int
      Store Key:
        code: ss_store_sk
        abstractType: int
      HDemo Key:
        code: ss_hdemo_sk
        abstractType: int
      Addr Key:
        code: ss_addr_sk
        abstractType: int
      Sold Time Key:
        code: ss_sold_time_sk
        abstractType: int
      Promo Key:
        code: ss_promo_sk
        abstractType: int
      Ticket Number:
        code: ss_ticket_number
        abstractType: int
      Quantity:
        code: ss_quantity
        abstractType: int
        numClass: additive
      Sales Price:
        code: ss_sales_price
        abstractType: float
        numClass: non-additive
      List Price:
        code: ss_list_price
        abstractType: float
        numClass: non-additive
      Coupon Amount:
        code: ss_coupon_amt
        abstractType: float
        numClass: additive
      Wholesale Cost:
        code: ss_wholesale_cost
        abstractType: float
        numClass: non-additive
      Ext Discount Amount:
        code: ss_ext_discount_amt
        abstractType: float
        numClass: additive
      Net Paid:
        code: ss_net_paid
        abstractType: float
        numClass: additive
      Ext Wholesale Cost:
        code: ss_ext_wholesale_cost
        abstractType: float
        numClass: additive
      Ext Sales Price:
        code: ss_ext_sales_price
        abstractType: float
        numClass: additive
      Ext List Price:
        code: ss_ext_list_price
        abstractType: float
        numClass: additive
      Ext Tax:
        code: ss_ext_tax
        abstractType: float
        numClass: additive
      # Cross-object: how long after the sale the return came back. TPC-DS
      # date keys are sequential day numbers, so the difference is in days.
      Return Delay:
        expression: "{[Store Returns].[Returned Date Key]} - {Sold Date Key}"
        abstractType: int
      # Cross-object: the reference joins on ss_customer_sk = sr_customer_sk.
      Same Return Customer:
        expression: "{Customer Key} = {[Store Returns].[Customer Key]}"
        abstractType: boolean
      Net Profit:
        code: ss_net_profit
        abstractType: float
        numClass: additive
    joins:
      - joinType: many-to-one
        joinTo: Date
        columnsFrom: [Sold Date Key]
        columnsTo: [Date Key]
      - joinType: many-to-one
        joinTo: Item
        columnsFrom: [Item Key]
        columnsTo: [Item Key]
      - joinType: many-to-one
        joinTo: Customer
        columnsFrom: [Customer Key]
        columnsTo: [Customer Key]
      - joinType: many-to-one
        joinTo: Customer Demographics
        columnsFrom: [CDemo Key]
        columnsTo: [Demographics Key]
      - joinType: many-to-one
        joinTo: Store
        columnsFrom: [Store Key]
        columnsTo: [Store Key]
      - joinType: many-to-one
        joinTo: Promotion
        columnsFrom: [Promo Key]
        columnsTo: [Promo Key]
      - joinType: many-to-one
        joinTo: Household Demographics
        columnsFrom: [HDemo Key]
        columnsTo: [Demo Key]
      - joinType: many-to-one
        joinTo: Time
        columnsFrom: [Sold Time Key]
        columnsTo: [Time Key]
      - joinType: many-to-one
        joinTo: Customer Address
        columnsFrom: [Addr Key]
        columnsTo: [Address Key]
        secondary: true
        pathName: sale_address
      - joinType: many-to-one
        joinTo: Sale Address
        columnsFrom: [Addr Key]
        columnsTo: [Address Key]
      - joinType: many-to-one
        joinTo: Store Returns
        columnsFrom: [Item Key, Ticket Number]
        columnsTo: [Item Key, Ticket Number]

  Store Returns:
    code: store_returns
    database: tpcds
    schema: tpcds
    columns:
      Returned Date Key:
        code: sr_returned_date_sk
        abstractType: int
      Item Key:
        code: sr_item_sk
        abstractType: int
      Customer Key:
        code: sr_customer_sk
        abstractType: int
      Store Key:
        code: sr_store_sk
        abstractType: int
      Ticket Number:
        code: sr_ticket_number
        abstractType: int
      Reason Key:
        code: sr_reason_sk
        abstractType: int
      Return Quantity:
        code: sr_return_quantity
        abstractType: int
        numClass: additive
      Return Amount:
        code: sr_return_amt
        abstractType: float
        numClass: additive
      Net Loss:
        code: sr_net_loss
        abstractType: float
        numClass: additive
    joins:
      - joinType: many-to-one
        joinTo: Date
        columnsFrom: [Returned Date Key]
        columnsTo: [Date Key]
      - joinType: many-to-one
        joinTo: Store Returned Date
        columnsFrom: [Returned Date Key]
        columnsTo: [Date Key]
      - joinType: many-to-one
        joinTo: Item
        columnsFrom: [Item Key]
        columnsTo: [Item Key]
      - joinType: many-to-one
        joinTo: Customer
        columnsFrom: [Customer Key]
        columnsTo: [Customer Key]
      - joinType: many-to-one
        joinTo: Store
        columnsFrom: [Store Key]
        columnsTo: [Store Key]
      - joinType: many-to-one
        joinTo: Reason
        columnsFrom: [Reason Key]
        columnsTo: [Reason Key]

  Web Sales:
    code: web_sales
    database: tpcds
    schema: tpcds
    columns:
      Sold Date Key:
        code: ws_sold_date_sk
        abstractType: int
      Item Key:
        code: ws_item_sk
        abstractType: int
      Ship Date Key:
        code: ws_ship_date_sk
        abstractType: int
      Warehouse Key:
        code: ws_warehouse_sk
        abstractType: int
      Ship Mode Key:
        code: ws_ship_mode_sk
        abstractType: int
      Web Site Key:
        code: ws_web_site_sk
        abstractType: int
      Sold Time Key:
        code: ws_sold_time_sk
        abstractType: int
      Ship HDemo Key:
        code: ws_ship_hdemo_sk
        abstractType: int
      Web Page Key:
        code: ws_web_page_sk
        abstractType: int
      Ship Delay:
        expression: "({Ship Date Key} - {Sold Date Key})"
        abstractType: int
      Bill Customer Key:
        code: ws_bill_customer_sk
        abstractType: int
      Order Number:
        code: ws_order_number
        abstractType: int
      Quantity:
        code: ws_quantity
        abstractType: int
        numClass: additive
      Sales Price:
        code: ws_sales_price
        abstractType: float
        numClass: non-additive
      Ext Sales Price:
        code: ws_ext_sales_price
        abstractType: float
        numClass: additive
      Net Profit:
        code: ws_net_profit
        abstractType: float
        numClass: additive
    joins:
      - joinType: many-to-one
        joinTo: Date
        columnsFrom: [Sold Date Key]
        columnsTo: [Date Key]
      - joinType: many-to-one
        joinTo: Item
        columnsFrom: [Item Key]
        columnsTo: [Item Key]
      - joinType: many-to-one
        joinTo: Customer
        columnsFrom: [Bill Customer Key]
        columnsTo: [Customer Key]
      - joinType: many-to-one
        joinTo: Warehouse
        columnsFrom: [Warehouse Key]
        columnsTo: [Warehouse Key]
      - joinType: many-to-one
        joinTo: Ship Mode
        columnsFrom: [Ship Mode Key]
        columnsTo: [Ship Mode Key]
      - joinType: many-to-one
        joinTo: Web Site
        columnsFrom: [Web Site Key]
        columnsTo: [Web Site Key]
      - joinType: many-to-one
        joinTo: Time
        columnsFrom: [Sold Time Key]
        columnsTo: [Time Key]
      - joinType: many-to-one
        joinTo: Household Demographics
        columnsFrom: [Ship HDemo Key]
        columnsTo: [Demo Key]
      - joinType: many-to-one
        joinTo: Web Page
        columnsFrom: [Web Page Key]
        columnsTo: [Web Page Key]
      - joinType: many-to-one
        joinTo: Date
        columnsFrom: [Ship Date Key]
        columnsTo: [Date Key]
        secondary: true
        pathName: ship_date
      - joinType: many-to-one
        joinTo: Web Sold Date
        columnsFrom: [Sold Date Key]
        columnsTo: [Date Key]
      - joinType: many-to-one
        joinTo: Web Returns
        columnsFrom: [Item Key, Order Number]
        columnsTo: [Item Key, Order Number]

  Catalog Sales:
    code: catalog_sales
    database: tpcds
    schema: tpcds
    columns:
      Sold Date Key:
        code: cs_sold_date_sk
        abstractType: int
      Item Key:
        code: cs_item_sk
        abstractType: int
      Bill Customer Key:
        code: cs_bill_customer_sk
        abstractType: int
      Ship Customer Key:
        code: cs_ship_customer_sk
        abstractType: int
      Bill CDemo Key:
        code: cs_bill_cdemo_sk
        abstractType: int
      Promo Key:
        code: cs_promo_sk
        abstractType: int
      Warehouse Key:
        code: cs_warehouse_sk
        abstractType: int
      Ship Date Key:
        code: cs_ship_date_sk
        abstractType: int
      Call Center Key:
        code: cs_call_center_sk
        abstractType: int
      Ship Delay:
        expression: "({Ship Date Key} - {Sold Date Key})"
        abstractType: int
      Ship Mode Key:
        code: cs_ship_mode_sk
        abstractType: int
      Order Number:
        code: cs_order_number
        abstractType: int
      Quantity:
        code: cs_quantity
        abstractType: int
        numClass: additive
      Sales Price:
        code: cs_sales_price
        abstractType: float
        numClass: non-additive
      Coupon Amount:
        code: cs_coupon_amt
        abstractType: float
        numClass: additive
      List Price:
        code: cs_list_price
        abstractType: float
        numClass: non-additive
      Ext Sales Price:
        code: cs_ext_sales_price
        abstractType: float
        numClass: additive
      Net Profit:
        code: cs_net_profit
        abstractType: float
        numClass: additive
    joins:
      - joinType: many-to-one
        joinTo: Date
        columnsFrom: [Sold Date Key]
        columnsTo: [Date Key]
      - joinType: many-to-one
        joinTo: Item
        columnsFrom: [Item Key]
