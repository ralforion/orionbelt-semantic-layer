sql: "WITH \"date_range\" AS (\nSELECT MIN(\"__ob_pop_src\".\"__ob_bucket\") AS min_date,\n       MAX(\"__ob_pop_src\".\"\
  __ob_bucket\") AS max_date\n  FROM (\n    SELECT date_trunc('month', \"Sales\".\"salesdate\") AS \"__ob_bucket\"\n     \
  \ FROM \"orionbelt_1\".\"sales\" AS \"Sales\"\n  ) AS \"__ob_pop_src\"\n),\n\"date_spine\" AS (\nSELECT d::date AS spine_date,\n\
  \       CASE WHEN (d + INTERVAL '-1 year')::date >= (SELECT min_date FROM \"date_range\")\n            THEN (d + INTERVAL\
  \ '-1 year')::date END AS spine_date_prev\nFROM generate_series((SELECT min_date FROM \"date_range\")::timestamp, (SELECT\
  \ max_date FROM \"date_range\")::timestamp, INTERVAL '1 month') AS t(d)\n),\n\"pop_base\" AS (\nSELECT \"date_spine\".spine_date\
  \ AS \"Sales Month\",\n       CAST(SUM(\"__ob_pop_src\".\"Sales__salesamount\") AS DECIMAL(18, 2)) AS \"Total Sales\"\n\
  \  FROM \"date_spine\"\n  LEFT JOIN (\n    SELECT date_trunc('month', \"Sales\".\"salesdate\") AS \"__ob_bucket\",\n   \
  \        \"Sales\".\"salesamount\" AS \"Sales__salesamount\"\n      FROM \"orionbelt_1\".\"sales\" AS \"Sales\"\n  ) AS\
  \ \"__ob_pop_src\"\n    ON \"__ob_pop_src\".\"__ob_bucket\" = \"date_spine\".spine_date\n  GROUP BY 1\n),\n\"pop_compare\"\
  \ AS (\nSELECT \"pop_base\".\"Sales Month\" AS \"Sales Month\",\n       \"pop_base\".\"Total Sales\" / NULLIF(pop_prev.\"\
  Total Sales\", 0) - 1 AS \"Sales YoY Growth\"\n  FROM \"pop_base\"\n  LEFT JOIN \"date_spine\" ON \"pop_base\".\"Sales Month\"\
  \ = \"date_spine\".spine_date\n  LEFT JOIN \"pop_base\" AS pop_prev\n    ON \"date_spine\".spine_date_prev = pop_prev.\"\
  Sales Month\"\n)\nSELECT \"Sales Month\" AS \"Sales Month\", CAST(\"Sales YoY Growth\" AS DECIMAL(18, 4)) AS \"Sales YoY\
  \ Growth\"\nFROM \"pop_compare\" AS \"pop_compare\"\n"
