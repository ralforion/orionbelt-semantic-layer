# Stage-1 pgwire compat: Dremio OSS connects to OrionBelt's pgwire as a
# Postgres source. See tests/integration/dremio/README.md for usage.
#
# Services on a shared bridge network:
#   - obsl      : the OrionBelt API image with PGWIRE_ENABLED=true on :5432
#                 (the commerce demo model + DuckDB are baked into the image)
#   - obsl-auth : the same image under AUTH_MODE=oidc with a token store and
#                 neither API keys nor TLS, for the BI token scenario
#                 (test_dremio_bi_token.py; run.sh makes its signing key)
#   - dremio    : dremio/dremio-oss exposing :9047 (REST) and :31010 (Flight)

services:
  obsl:
    build: &obsl-build
      context: ../../..
      dockerfile: Dockerfile
      args:
        # Stage 2 (Dremio-backed model) needs ob-dremio in the runtime;
        # the default `flight-duckdb-only` extra omits it. The full
        # `flight` extra pulls all 8 vendor drivers including ob-dremio.
        OB_EXTRA: flight
    image: orionbelt-semantic-layer-api:dremio-test
    environment:
      LOG_LEVEL: INFO
      LOG_FORMAT: console
      API_SERVER_HOST: 0.0.0.0
      PORT: 8080
      PGWIRE_ENABLED: "true"
      PGWIRE_HOST: 0.0.0.0
      PGWIRE_PORT: "5432"
      PGWIRE_AUTH_MODE: trust
      QUERY_EXECUTE: "true"
      DB_VENDOR: duckdb
      DUCKDB_DATABASE: /app/data/orionbelt_1_commerce.duckdb
      MODEL_DIR: /app/data
      # Override the base image's single-entry MODEL_FILES so the catalog
      # exposes two tables (``orionbelt_1_commerce`` + ``dremio_info_schema``):
      #   - orionbelt_1_commerce.yaml — Stage 1 (DuckDB backend, baked in)
      #   - dremio_info_schema.yaml   — Stage 2 (Dremio backend, queries
      #     Dremio's INFORMATION_SCHEMA.COLUMNS — always available, no
      #     dataset promotion needed)
      MODEL_FILES: orionbelt_1_commerce.yaml,/app/stage2/dremio_info_schema.yaml
      # Stage-2 backend connection. ob_flight.db_router reads these to
      # wire ob_dremio.connect() back to the same Dremio container.
      DREMIO_HOST: dremio
      DREMIO_PORT: "32010"
      DREMIO_USERNAME: obsl_admin
      DREMIO_PASSWORD: obsl_admin_pw_123!
    volumes:
      - ./stage2:/app/stage2:ro
      - raw_export:/app/raw_export
    ports:
      - "18080:8080"
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status == 200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # OrionBelt with sign-in: Dremio logs in with a BI token (SCRAM, its id as
  # the user name), the only way in without API keys or TLS. Its identity
  # provider's keys come from sign_in.py's key set, made by run.sh before the
  # stack starts (OIDC_JWKS_FILE is read once, at startup); the tests sign
  # Alice's access token with the private key on the host.
  obsl-auth:
    build: *obsl-build
    image: orionbelt-semantic-layer-api:dremio-test
    environment:
      LOG_LEVEL: INFO
      LOG_FORMAT: console
      API_SERVER_HOST: 0.0.0.0
      PORT: 8080
      PGWIRE_ENABLED: "true"
      PGWIRE_HOST: 0.0.0.0
      PGWIRE_PORT: "5432"
      QUERY_EXECUTE: "true"
      DB_VENDOR: duckdb
      DUCKDB_DATABASE: /app/data/orionbelt_1_commerce.duckdb
      MODEL_DIR: /app/data
      MODEL_FILES: orionbelt_1_commerce.yaml
      AUTH_MODE: oidc
      OIDC_ISSUER: https://idp.test/realms/obsl
      OIDC_AUDIENCE: obsl-api
      OIDC_JWKS_FILE: /auth/jwks.json
      TOKEN_STORE_PATH: /tmp/obsl-tokens/bi_tokens.sqlite
    volumes:
      - ./.auth/public:/auth:ro
    ports:
      - "18081:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status == 200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  ui:
    build:
      context: ../../..
      dockerfile: Dockerfile.ui
    image: orionbelt-semantic-layer-ui:dremio-test
    environment:
      PORT: "7860"
      API_BASE_URL: http://obsl:8080
    ports:
      - "17860:7860"
    depends_on:
      obsl:
        condition: service_healthy

  dremio:
    image: dremio/dremio-oss:latest
    ports:
      - "19047:9047"
      - "31010:31010"
      # Arrow Flight SQL. Published so the ob-dremio driver suite can reach
      # Dremio from the host, the same way ob_dremio reaches it from inside
      # the OBSL container.
      - "32010:32010"
    environment:
      DREMIO_JAVA_SERVER_EXTRA_OPTS: -Xms1g -Xmx2g
    volumes:
      - raw_export:/raw_export:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9047/apiv2/server_status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    depends_on:
      obsl:
        condition: service_healthy

volumes:
  raw_export:
